<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Senarai peserta yang menyertai trip pada sesuatu tarikh">
  <title>Senarai Peserta Trip</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>window.APP = { SCRIPT_URL: "https://script.google.com/macros/s/AKfycbxnc5yfZcmNT06YoJfRqDp326Lnnlv7lkt2CgMEtITNm_9N9lQmR2Bsqjkg2Lz5EYlejQ/exec" };</script>
</head>
<body class="min-h-screen bg-slate-100">

  <div id="viewLogin" class="min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-sm bg-white rounded-2xl shadow-xl p-6">
      <h1 class="text-lg font-bold text-slate-800">Senarai Peserta Trip</h1>
      <p class="text-sm text-slate-500 mt-1">Masukkan token untuk melihat senarai nama peserta.</p>
      <form id="formLogin" class="mt-4 space-y-4" novalidate>
        <div>
          <label for="token" class="block text-sm font-medium text-slate-700 mb-1">Token</label>
          <input id="token" name="token" type="password" required autocomplete="current-password"
                 class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:border-sky-600 focus:outline-none focus:ring-2 focus:ring-sky-600/20">
          <p id="err-login" class="text-red-600 text-xs mt-1 hidden" role="alert"></p>
        </div>
        <button id="btnLogMasuk" type="submit"
                class="w-full bg-sky-700 hover:bg-sky-800 text-white font-semibold rounded-lg px-3 py-2 text-sm transition-colors focus:outline-none focus:ring-2 focus:ring-sky-600/40">
          <svg id="spinnerLogMasuk" class="hidden animate-spin -ml-1 mr-2 h-4 w-4 inline-block" viewBox="0 0 24 24" fill="none">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
          </svg>
          <span id="teksLogMasuk">Log Masuk</span>
        </button>
      </form>
      <a href="index.html"
         class="block text-center text-slate-500 hover:text-slate-700 text-xs mt-3 underline focus:outline-none focus:ring-2 focus:ring-slate-400/40 rounded">
        Muka Utama
      </a>
    </div>
  </div>

  <div id="viewSenarai" class="hidden">
    <header class="bg-slate-900 text-white">
      <div class="max-w-3xl mx-auto px-4 py-4 flex items-center justify-between gap-4">
        <div>
          <h1 class="font-bold">Senarai Peserta</h1>
          <p class="text-xs text-slate-400">Peserta: <span id="bilangan">0</span></p>
        </div>
        <div class="flex items-center gap-2">
          <button id="btnLogKeluar" type="button"
                  class="text-slate-300 hover:text-white text-sm font-medium rounded-lg px-3 py-1.5 transition-colors focus:outline-none focus:ring-2 focus:ring-slate-400/40">
            Log Keluar
          </button>
        </div>
      </div>
    </header>

    <main class="max-w-3xl mx-auto px-4 py-6">
      <div class="bg-white rounded-xl shadow overflow-hidden mb-4">
        <div class="p-4 flex flex-wrap items-end gap-3">
          <div class="flex-1 min-w-[180px]">
            <label for="tarikh" class="block text-sm font-medium text-slate-700 mb-1">Tarikh Trip</label>
            <input id="tarikh" name="tarikh" type="date" required
                   class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:border-sky-600 focus:outline-none focus:ring-2 focus:ring-sky-600/20">
          </div>
          <button id="btnMuat" type="button"
                  class="bg-sky-700 hover:bg-sky-800 text-white text-sm font-medium rounded-lg px-4 py-2 transition-colors focus:outline-none focus:ring-2 focus:ring-sky-600/40">
            <svg id="spinnerMuat" class="hidden animate-spin -ml-1 mr-2 h-3.5 w-3.5 inline-block" viewBox="0 0 24 24" fill="none">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
            </svg>
            <span id="teksMuat">Cari</span>
          </button>
        </div>
      </div>

      <div id="pesan" class="hidden mb-4" role="alert"></div>

      <div class="bg-white rounded-xl shadow overflow-hidden">
        <div id="kosong" class="px-4 py-8 text-center text-sm text-slate-400 hidden">Tiada peserta untuk tarikh ini.</div>
        <ul id="senaraiNama" class="divide-y divide-slate-200"></ul>
      </div>
    </main>
  </div>

  <script>
    (function () {
      var scriptUrl = (window.APP && window.APP.SCRIPT_URL) ? window.APP.SCRIPT_URL : "";
      var simpanToken = localStorage.getItem("bf_token") || "";
      var timeoutId = null;

      function hariIni() {
        var d = new Date();
        var m = String(d.getMonth() + 1);
        var h = String(d.getDate());
        if (m.length < 2) m = "0" + m;
        if (h.length < 2) h = "0" + h;
        return d.getFullYear() + "-" + m + "-" + h;
      }

      function tunjukLogin() {
        document.getElementById("viewLogin").classList.remove("hidden");
        document.getElementById("viewSenarai").classList.add("hidden");
      }

      function tunjukSenarai() {
        document.getElementById("viewLogin").classList.add("hidden");
        document.getElementById("viewSenarai").classList.remove("hidden");
      }

      function formatMasa(t) {
        try {
          return new Date(t).toLocaleString("ms-MY", { hour: "2-digit", minute: "2-digit" });
        } catch (e) {
          return "";
        }
      }

      function setPesanJelas() {
        var el = document.getElementById("pesan");
        el.classList.add("hidden");
        el.classList.remove("text-red-600", "text-emerald-700");
        el.textContent = "";
      }

      function setPesan(msg, fail) {
        var el = document.getElementById("pesan");
        el.classList.remove("hidden", "text-red-600", "text-emerald-700");
        el.classList.add(fail ? "text-red-600" : "text-emerald-700");
        el.textContent = msg;
      }

      function siapMuat() {
        var btn = document.getElementById("btnMuat");
        btn.disabled = false;
        document.getElementById("teksMuat").textContent = "Cari";
        document.getElementById("spinnerMuat").classList.add("hidden");
        var lb = document.getElementById("btnLogMasuk");
        lb.disabled = false;
        document.getElementById("teksLogMasuk").textContent = "Log Masuk";
        document.getElementById("spinnerLogMasuk").classList.add("hidden");
      }

      function renderSenarai(senarai) {
        var bilEl = document.getElementById("bilangan");
        bilEl.textContent = senarai.length;

        var ul = document.getElementById("senaraiNama");
        ul.innerHTML = "";
        var kosong = document.getElementById("kosong");

        if (!senarai.length) {
          kosong.classList.remove("hidden");
          return;
        }
        kosong.classList.add("hidden");

        senarai.forEach(function (r, i) {
          var li = document.createElement("li");
          li.className = "px-4 py-3 flex items-center justify-between gap-3";
          var spanNama = document.createElement("span");
          spanNama.className = "text-sm text-slate-800";
          spanNama.textContent = (i + 1) + ". " + r.nama;
          var spanMasa = document.createElement("span");
          spanMasa.className = "text-xs text-slate-400 whitespace-nowrap";
          spanMasa.textContent = formatMasa(r.timestamp);
          li.appendChild(spanNama);
          li.appendChild(spanMasa);
          ul.appendChild(li);
        });
      }

      function ambilSenarai() {
        setPesanJelas();
        var tarikh = document.getElementById("tarikh").value;
        if (!tarikh) {
          setPesan("Sila pilih tarikh.", true);
          return;
        }

        var btn = document.getElementById("btnMuat");
        btn.disabled = true;
        document.getElementById("teksMuat").textContent = "Memuat...";
        document.getElementById("spinnerMuat").classList.remove("hidden");

        if (timeoutId) clearTimeout(timeoutId);
        timeoutId = setTimeout(function () {
          siapMuat();
          setPesan("Ralat memuat data. Sila cuba lagi.", true);
          tunjukLogin();
        }, 10000);

        window.bfJsonp = function (data) {
          if (timeoutId) clearTimeout(timeoutId);
          siapMuat();
          if (data && data.ok) {
            renderSenarai(data.rows || []);
            localStorage.setItem("bf_token", simpanToken);
            tunjukSenarai();
          } else {
            localStorage.removeItem("bf_token");
            setPesan("Token tidak sah.", true);
            tunjukLogin();
          }
        };

        var s = document.createElement("script");
        s.src = scriptUrl + "?token=" + encodeURIComponent(simpanToken) + "&mode=senarai&tarikh=" + encodeURIComponent(tarikh) + "&callback=bfJsonp";
        s.onerror = function () {
          if (timeoutId) clearTimeout(timeoutId);
          siapMuat();
          setPesan("Ralat memuat data. Sila cuba lagi.", true);
          tunjukLogin();
        };
        document.head.appendChild(s);
      }

      document.getElementById("formLogin").addEventListener("submit", function (e) {
        e.preventDefault();
        var er = document.getElementById("err-login");
        er.classList.add("hidden");
        simpanToken = document.getElementById("token").value.trim();
        if (!simpanToken) {
          er.textContent = "Sila masukkan token.";
          er.classList.remove("hidden");
          return;
        }
        var lb = document.getElementById("btnLogMasuk");
        lb.disabled = true;
        document.getElementById("teksLogMasuk").textContent = "Memuat...";
        document.getElementById("spinnerLogMasuk").classList.remove("hidden");
        ambilSenarai();
      });

      document.getElementById("btnMuat").addEventListener("click", ambilSenarai);

      document.getElementById("btnLogKeluar").addEventListener("click", function () {
        localStorage.removeItem("bf_token");
        simpanToken = "";
        document.getElementById("token").value = "";
        setPesanJelas();
        tunjukLogin();
      });

      document.getElementById("tarikh").value = hariIni();

      if (simpanToken) {
        tunjukSenarai();
        ambilSenarai();
      } else {
        tunjukLogin();
      }
    })();
  </script>
</body>
</html>
