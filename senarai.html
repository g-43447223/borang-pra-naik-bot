<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Senarai peserta yang menyertai trip pada sesuatu tarikh">
  <title>Senarai Peserta Trip</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>window.APP = { SCRIPT_URL: "<?= ScriptApp.getService().getUrl() ?>" };</script>
</head>
<body class="min-h-screen bg-gradient-to-b from-sky-50 via-slate-100 to-slate-100">

  <div id="viewSenarai">
    <header class="bg-gradient-to-r from-sky-900 via-slate-900 to-slate-900 text-white">
      <div class="max-w-3xl mx-auto px-4 py-4">
        <div>
          <h1 class="font-bold inline-flex items-center gap-2">
            <svg class="inline-block w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 13l18-1.5L18 18H6L3 13z"/><path d="M8 13V7h3.5L16 9v4"/><path d="M2 20h20"/></svg>
            Senarai Peserta Trip
          </h1>
          <p class="text-xs text-slate-400">Peserta: <span id="bilangan">0</span></p>
        </div>
      </div>
    </header>

    <main class="max-w-3xl mx-auto px-4 py-6 pb-36">
      <div class="bg-amber-50 border border-amber-200 rounded-xl px-4 py-3 text-sm text-amber-800 mb-4">
        Untuk kegunaan kecemasan — hubungi waris peserta jika perlu.
      </div>

      <div class="bg-white rounded-xl border border-sky-100 shadow p-4 mb-4">
        <label for="tarikh" class="block text-sm font-medium text-slate-700 mb-1">Tarikh Trip</label>
        <input id="tarikh" name="tarikh" type="date" required
               class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:border-sky-600 focus:outline-none focus:ring-2 focus:ring-sky-600/20">
      </div>

      <div id="pesan" class="hidden mb-4" role="alert"></div>

      <div class="bg-white rounded-xl shadow overflow-hidden">
        <div id="kosong" class="px-4 py-8 text-center text-sm text-slate-400 hidden">Tiada peserta untuk tarikh ini.</div>
        <ul id="senaraiNama" class="divide-y divide-slate-200"></ul>
      </div>
    </main>

    <div class="fixed bottom-0 inset-x-0 z-30">
      <div class="bg-white/95 backdrop-blur border-t border-slate-200 px-4 pt-3 pb-[calc(0.75rem+env(safe-area-inset-bottom))] shadow-[0_-8px_30px_rgba(0,0,0,0.08)]">
        <div class="max-w-3xl mx-auto space-y-2">
          <button id="btnMuat" type="button"
                  class="w-full bg-sky-700 hover:bg-sky-800 text-white text-sm font-semibold rounded-xl px-4 py-3 transition-colors focus:outline-none focus:ring-2 focus:ring-sky-600/40">
            <svg id="spinnerMuat" class="hidden animate-spin -ml-1 mr-2 h-4 w-4 inline-block" viewBox="0 0 24 24" fill="none">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
            </svg>
            <span id="teksMuat">Cari</span>
          </button>
          <div class="flex gap-1">
            <a href="<?= ScriptApp.getService().getUrl() ?>"
               class="flex-1 flex flex-col items-center gap-1 py-1 rounded-xl text-sky-700 hover:bg-sky-50 transition-colors focus:outline-none focus:ring-2 focus:ring-sky-500/40">
              <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5L12 3l9 7.5"/><path d="M5 10v10a1 1 0 001 1h4v-6h4v6h4a1 1 0 001-1V10"/></svg>
              <span class="text-[11px] font-medium text-slate-500">Menu Utama</span>
            </a>
            <a href="<?= ScriptApp.getService().getUrl() ?>?page=form"
               class="flex-1 flex flex-col items-center gap-1 py-1 rounded-xl text-sky-700 hover:bg-sky-50 transition-colors focus:outline-none focus:ring-2 focus:ring-sky-500/40">
              <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
              <span class="text-[11px] font-medium text-slate-500">Isi Borang</span>
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    (function () {
      var scriptUrl = (window.APP && window.APP.SCRIPT_URL) ? window.APP.SCRIPT_URL : "";
      var timeoutId = null;

      function hariIni() {
        var d = new Date();
        var m = String(d.getMonth() + 1);
        var h = String(d.getDate());
        if (m.length < 2) m = "0" + m;
        if (h.length < 2) h = "0" + h;
        return d.getFullYear() + "-" + m + "-" + h;
      }

      function formatMasa(t) {
        try {
          return new Date(t).toLocaleString("ms-MY", { hour: "2-digit", minute: "2-digit" });
        } catch (e) {
          return "";
        }
      }

      function noWhatsapp(num) {
        var d = String(num == null ? "" : num).replace(/[^0-9]/g, "");
        if (d.charAt(0) === "0") d = "60" + d.substring(1);
        return d;
      }

      function setPesanJelas() {
        var el = document.getElementById("pesan");
        el.classList.add("hidden");
        el.classList.remove("text-red-600", "text-emerald-700");
        el.textContent = "";
      }

      function setPesan(msg, fail) {
        var el = document.getElementById("pesan");
        el.classList.remove("hidden", "text-red-600", "text-emerald-700");
        el.classList.add(fail ? "text-red-600" : "text-emerald-700");
        el.textContent = msg;
      }

      function siapMuat() {
        var btn = document.getElementById("btnMuat");
        btn.disabled = false;
        document.getElementById("teksMuat").textContent = "Cari";
        document.getElementById("spinnerMuat").classList.add("hidden");
      }

      function renderSenarai(senarai) {
        document.getElementById("bilangan").textContent = senarai.length;

        var ul = document.getElementById("senaraiNama");
        ul.innerHTML = "";
        var kosong = document.getElementById("kosong");

        if (!senarai.length) {
          kosong.classList.remove("hidden");
          return;
        }
        kosong.classList.add("hidden");

        senarai.forEach(function (r, i) {
          var li = document.createElement("li");
          li.className = "px-4 py-3 flex items-center justify-between gap-3 hover:bg-sky-50";

          var kiri = document.createElement("div");
          var spanNama = document.createElement("span");
          spanNama.className = "block text-sm font-medium text-slate-800";
          spanNama.textContent = (i + 1) + ". " + r.nama;
          var spanMasa = document.createElement("span");
          spanMasa.className = "block text-xs text-slate-400";
          spanMasa.textContent = (r.trip ? "Trip: " + r.trip + " · " : "") + formatMasa(r.timestamp);
          kiri.appendChild(spanNama);
          kiri.appendChild(spanMasa);

          var a = document.createElement("a");
          a.href = "https://wa.me/" + noWhatsapp(r.waris);
          a.target = "_blank";
          a.rel = "noopener noreferrer";
          a.className = "inline-block bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-semibold rounded-lg px-3 py-1.5 whitespace-nowrap transition-colors focus:outline-none focus:ring-2 focus:ring-emerald-600/40";
          a.textContent = "WhatsApp Waris";

          li.appendChild(kiri);
          li.appendChild(a);
          ul.appendChild(li);
        });
      }

      function ambilSenarai() {
        setPesanJelas();
        var tarikh = document.getElementById("tarikh").value;
        if (!tarikh) {
          setPesan("Sila pilih tarikh.", true);
          return;
        }

        var btn = document.getElementById("btnMuat");
        btn.disabled = true;
        document.getElementById("teksMuat").textContent = "Memuat...";
        document.getElementById("spinnerMuat").classList.remove("hidden");

        if (timeoutId) clearTimeout(timeoutId);
        timeoutId = setTimeout(function () {
          siapMuat();
          setPesan("Ralat memuat data. Sila cuba lagi atau sahkan tarikh.", true);
        }, 10000);

        window.bfJsonp = function (data) {
          if (timeoutId) clearTimeout(timeoutId);
          siapMuat();
          if (data && data.ok) {
            renderSenarai(data.rows || []);
          } else {
            setPesan(data && data.error ? data.error : "Ralat memuat data.", true);
          }
        };

        var s = document.createElement("script");
        s.src = scriptUrl + "?mode=senarai&tarikh=" + encodeURIComponent(tarikh) + "&callback=bfJsonp";
        s.onerror = function () {
          if (timeoutId) clearTimeout(timeoutId);
          siapMuat();
          setPesan("Ralat memuat data. Sila cuba lagi.", true);
        };
        document.head.appendChild(s);
      }

      document.getElementById("btnMuat").addEventListener("click", ambilSenarai);
      document.getElementById("tarikh").value = hariIni();
      ambilSenarai();
    })();
  </script>
</body>
</html>
